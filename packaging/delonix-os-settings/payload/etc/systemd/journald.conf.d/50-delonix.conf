# DelonixOS — diário do sistema.
#
# O journal é persistente (queremos ver o arranque de ontem quando uma VM
# desapareceu). Sem tecto, cresce até 10% do disco e cada arranque paga a
# validação de ficheiros que ninguém vai ler.
#
# 512 MB dão semanas de histórico num posto de trabalho e mantêm o
# `journalctl -b -1` instantâneo.
[Journal]
Storage=persistent
SystemMaxUse=512M
SystemMaxFileSize=64M
MaxRetentionSec=1month

# Escrever no disco a cada linha custa I/O no arranque, que é precisamente
# quando há mais linhas. Cinco segundos de janela é o compromisso normal.
SyncIntervalSec=5m

# Um container em ciclo de reinício pode gerar milhares de linhas por segundo.
# Sem limite, enche o disco e afoga o resto do diário.
RateLimitIntervalSec=30s
RateLimitBurst=10000
