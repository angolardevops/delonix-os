# DelonixOS — contabilidade de recursos ligada.
#
# Nada do que se segue (pesos de CPU, limites de memória, prioridade de I/O)
# funciona sem isto: o systemd só aplica controlo de recursos aos serviços onde
# a contabilidade está activa, e por omissão só a de tarefas está.
#
# Custo: alguns por cento de overhead no kernel. Ganho: um `cargo build -j32`
# deixa de poder engolir a máquina inteira.
[Manager]
DefaultCPUAccounting=yes
DefaultMemoryAccounting=yes
DefaultIOAccounting=yes
DefaultIPAccounting=no
DefaultTasksMax=infinity
