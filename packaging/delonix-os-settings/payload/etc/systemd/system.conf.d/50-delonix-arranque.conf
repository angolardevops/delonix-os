# DelonixOS — tempos de espera do systemd.
#
# Os valores por omissão do systemd são pensados para servidores, onde esperar
# 90 segundos por um serviço teimoso é preferível a matá-lo. Num posto de
# trabalho o efeito é outro: um `reboot` que devia demorar cinco segundos fica
# parado num ecrã preto a dizer "A stop job is running (1min 30s)".
#
# O caso mais comum aqui é uma VM do libvirt ou um container que não fecha à
# primeira. Dez segundos chegam para um encerramento limpo; a partir daí é
# SIGKILL, que é o que a pessoa ia fazer de qualquer maneira.
[Manager]
DefaultTimeoutStartSec=25s
DefaultTimeoutStopSec=10s
DefaultDeviceTimeoutSec=15s

# Um serviço que morre e reinicia em ciclo não deve prender o arranque.
DefaultRestartSec=2s
