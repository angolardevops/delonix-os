# DelonixOS — a sessão do utilizador ganha à do sistema.
#
# O caso real: um `pacman -Syu` ou um `podman build` a correr em system.slice
# não pode roubar CPU ao desktop. O peso é relativo (o default é 100), por isso
# isto não "reserva" nada — só diz quem cede quando há disputa.
[Slice]
CPUWeight=200
IOWeight=200
# Espaço de manobra antes de o kernel começar a recuperar memória à força: o
# `MemoryHigh` trava suavemente em vez de matar, que é o que faz a diferença
# entre "está lento por uns segundos" e "o desktop congelou".
MemoryHigh=85%
ManagedOOMMemoryPressure=kill
ManagedOOMMemoryPressureLimit=60%
