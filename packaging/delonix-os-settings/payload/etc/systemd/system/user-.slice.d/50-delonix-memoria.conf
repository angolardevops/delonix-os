[Slice]
# TECTO SUAVE de memória para a sessão do utilizador.
#
# `MemoryHigh` não é um limite duro: quando é ultrapassado, o kernel PRESSIONA a
# recuperação de páginas em vez de matar. É a diferença entre uma sessão que
# abranda por momentos e uma que perde o trabalho.
#
# Porquê 85% e não um valor fixo: numa máquina de 8 GB e noutra de 64 GB o
# problema é o mesmo — deixar sempre folga para o kernel e para o que está fora
# da sessão (containers de sistema, o motor de VMs).
MemoryHigh=85%

# `MemorySwapMax` sem limite: com zram, trocar é COMPRIMIR na RAM, não escrever
# no disco. Impedir isso seria desperdiçar exactamente o mecanismo que evita o
# congelamento sob carga.
MemorySwapMax=infinity
