# DelonixOS — delegação de cgroup v2 para a sessão do utilizador.
#
# Sem isto, containers rootless (Delonix Runtime, podman) não conseguem aplicar
# limites de CPU/memória/pids: o kernel recusa escrever nos controladores do
# cgroup do utilizador. Sintoma típico: "--memory not supported without cgroup
# delegation" ou limites silenciosamente ignorados.
[Service]
Delegate=cpu cpuset io memory pids
