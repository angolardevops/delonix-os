# DelonixOS — quando for preciso matar alguma coisa, que seja a certa.
#
# O `earlyoom` já cá está e actua por memória livre. O systemd-oomd actua por
# PRESSÃO (PSI), que é a métrica que percebe a diferença entre "a RAM está cheia
# mas o sistema anda" e "o sistema está a passar o tempo à espera de memória".
#
# Os dois juntos não se atrapalham: o oomd age antes, a nível de cgroup, e
# escolhe o cgroup com mais pressão — tipicamente o build, não o compositor.
[OOM]
DefaultMemoryPressureLimit=60%
DefaultMemoryPressureDurationSec=20s
SwapUsedLimit=95%
