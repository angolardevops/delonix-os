# NVIDIA num portátil híbrido: desligar a placa quando ninguém a usa.
#
# MEDIDO no ROG onde isto foi escrito, com a iGPU a fazer todo o trabalho:
#
#   /sys/bus/pci/devices/0000:01:00.0/power/runtime_status → active
#   NVreg_DynamicPowerManagement                           → não configurado
#
# Uma dGPU acordada sem nada para fazer custa entre 10 e 25 W. Num portátil isso
# é a diferença entre quatro horas e duas horas e meia de bateria — e é também a
# razão de a ventoinha nunca parar, porque o calor tem de sair de algum lado.
#
# `0x02` é o RTD3 completo: o driver desliga a GPU quando o último cliente sai.
# Em placas ou kernels que não o suportem, o parâmetro é ignorado — não há
# caminho em que isto parta alguma coisa.
options nvidia NVreg_DynamicPowerManagement=0x02

# Manter os registos de vídeo na memória de sistema durante a suspensão: sem
# isto, a placa precisa de ficar alimentada para os preservar.
options nvidia NVreg_PreserveVideoMemoryAllocations=1
options nvidia NVreg_TemporaryFilePath=/var/tmp
