# DelonixOS — virtualização.
#
# Nested: correr um hipervisor DENTRO de uma VM. É o que permite testar um
# cluster DKS, ou um lab de Kubernetes com nós virtuais, sem precisar de mais
# hardware. Sem isto, `kvm-ok` dentro da VM diz que não há aceleração e tudo
# passa a emulação (10-20x mais lento).
options kvm_intel nested=1
options kvm_amd   nested=1

# Halt-polling: reduz a latência de acordar uma vCPU à custa de um pouco de CPU
# do host. Num posto de labs, a latência é o que se nota.
options kvm halt_poll_ns=200000

# vhost-net: filas de rede para VMs; 1024 é o suficiente para dezenas de VMs.
options vhost_net experimental_zcopytx=0
