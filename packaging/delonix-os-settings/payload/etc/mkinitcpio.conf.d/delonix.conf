# DelonixOS — initramfs.
#
# O splash SÓ aparece se o hook `plymouth` estiver no initramfs: o tema em
# /usr/share/plymouth/themes/delonix não chega. Sintoma de estar mal: mensagens
# de kernel a correr no arranque em vez do logótipo.
#
# A ordem importa — `plymouth` tem de vir depois de `kms` (precisa do driver de
# vídeo já carregado) e antes de `block`/`filesystems` (para poder pedir a
# palavra-passe do disco cifrado).
#
# Para discos cifrados o Calamares acrescenta `encrypt`/`sd-encrypt` a esta
# linha durante a instalação; se editares à mão, corre `sudo mkinitcpio -P`.
HOOKS=(base udev autodetect microcode modconf kms keyboard keymap consolefont plymouth block filesystems fsck)
