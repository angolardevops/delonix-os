# DelonixOS — limites por sessão.
# 1024 fds é pouco para quem corre um cluster local, um IDE e meia dúzia de
# `kubectl logs -f` ao mesmo tempo.
*   soft  nofile   1048576
*   hard  nofile   1048576
*   soft  nproc    unlimited
*   hard  nproc    unlimited
*   soft  memlock  unlimited
*   hard  memlock  unlimited
# Dumps de core desligados por omissão (podem conter segredos em memória).
*   hard  core     0
