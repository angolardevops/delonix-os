[Theme]
Current=delonix
CursorTheme=breeze_cursors

[General]
# Wayland por omissão no Plasma 6; o X11 continua disponível no selector.
DisplayServer=wayland
GreeterEnvironment=QT_WAYLAND_SHELL_INTEGRATION=layer-shell,QT_SCALE_FACTOR_ROUNDING_POLICY=RoundPreferFloor
InputMethod=

[Users]
MaximumUid=60513
MinimumUid=1000
HideUsers=
HideShells=/usr/bin/nologin,/sbin/nologin

[Wayland]
CompositorCommand=kwin_wayland --drm --no-lockscreen --no-global-shortcuts --locale1
