# DelonixOS — módulos carregados no arranque.
tcp_bbr          # congestion control usado em /etc/sysctl.d/99-delonix.conf
overlay          # overlayfs para imagens OCI
br_netfilter     # bridges de containers vistas pelo nftables
nf_conntrack     # conntrack -L em depuração de rede
vhost_net        # VMs com rede acelerada (DKS local, Delonix Runtime)
kvm              # virtualização (o módulo do fabricante é carregado sozinho)
