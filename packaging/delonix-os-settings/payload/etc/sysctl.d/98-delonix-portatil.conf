# Escrita em disco num portátil.
#
# Os valores por omissão do kernel fazem sentido num servidor com bateria no
# controlador RAID. Num portátil, acordar o disco a cada cinco segundos para
# escrever alguns kilobytes gasta energia e não protege ninguém — um SSD moderno
# perde o mesmo com 5 ou com 60 segundos de janela.
vm.dirty_writeback_centisecs = 6000
vm.dirty_expire_centisecs = 6000

# `laptop_mode` faz o kernel agrupar as escritas com os acessos que já estavam a
# acontecer, em vez de as espalhar. Só actua quando o disco já está acordado.
vm.laptop_mode = 5

# Com zram, trocar é comprimir na RAM — barato. O valor por omissão (60) é
# pensado para swap em disco e deixa a RAM encher antes de comprimir seja o quê.
vm.swappiness = 150
vm.page-cluster = 0
