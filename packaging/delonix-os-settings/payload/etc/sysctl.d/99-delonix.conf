# DelonixOS — afinação de kernel para trabalho de plataforma.
# Cada valor tem um sintoma associado; não há aqui "tuning" por superstição.

## --- watchers -----------------------------------------------------------------
# Sintoma: "too many open files" no `kubectl logs -f`, no watchexec, no VS Code
# ou em qualquer controlador que faça watch. O default (128 instâncias) morre
# com 3 ou 4 ferramentas abertas ao mesmo tempo.
fs.inotify.max_user_instances = 8192
fs.inotify.max_user_watches   = 1048576
fs.inotify.max_queued_events  = 65536

## --- descritores --------------------------------------------------------------
fs.file-max = 2097152
fs.nr_open  = 2097152

## --- memória ------------------------------------------------------------------
# Sintoma: Elasticsearch/OpenSearch e várias JVM recusam arrancar com o default.
vm.max_map_count = 262144
# Com zram (ver /etc/systemd/zram-generator.conf) trocar páginas é barato:
# vale mais comprimir do que matar processos.
vm.swappiness = 100
vm.vfs_cache_pressure = 50
vm.dirty_background_ratio = 5
vm.dirty_ratio = 15
# Reclaim começa mais cedo: numa máquina que salta entre builds, browsers e VMs,
# esperar pelo limiar default é o que produz aquelas pausas de meio segundo.
vm.watermark_scale_factor = 125
vm.page-cluster = 0

## --- rede ---------------------------------------------------------------------
# Sintoma: `connection refused` sob carga em testes locais (hey, k6, ab).
net.core.somaxconn = 4096
net.core.netdev_max_backlog = 16384
net.ipv4.tcp_max_syn_backlog = 8192
net.ipv4.tcp_fastopen = 3
net.ipv4.tcp_mtu_probing = 1
net.ipv4.ip_local_port_range = 10240 65535
# bbr precisa do módulo tcp_bbr (carregado por /etc/modules-load.d/delonix.conf)
# e do qdisc `fq` — sem ele o bbr fica activo mas sem o pacing que o faz valer.
net.ipv4.tcp_congestion_control = bbr
net.core.default_qdisc = fq
net.ipv4.tcp_notsent_lowat = 131072
net.core.rmem_max = 16777216
net.core.wmem_max = 16777216
net.ipv4.tcp_rmem = 4096 131072 16777216
net.ipv4.tcp_wmem = 4096 65536 16777216
# Encaminhamento: preciso para bridges de containers e para VMs em ponte.
net.ipv4.ip_forward = 1
net.ipv6.conf.all.forwarding = 1

## --- containers rootless ------------------------------------------------------
# Namespaces de utilizador: é o que sustenta o Delonix Runtime e o podman
# rootless. No Arch/Manjaro já vem ligado, fixamos por segurança.
user.max_user_namespaces = 63359
kernel.unprivileged_userns_clone = 1

## --- labs com muitas VMs e containers ------------------------------------------
# Sintoma: "neighbour table overflow" no dmesg e rede a cair quando passam de
# ~1000 endereços na mesma bridge (dezenas de VMs + centenas de containers).
net.ipv4.neigh.default.gc_thresh1 = 4096
net.ipv4.neigh.default.gc_thresh2 = 8192
net.ipv4.neigh.default.gc_thresh3 = 16384
net.ipv6.neigh.default.gc_thresh1 = 4096
net.ipv6.neigh.default.gc_thresh2 = 8192
net.ipv6.neigh.default.gc_thresh3 = 16384

# Sintoma: "nf_conntrack: table full, dropping packet" com muitos fluxos.
net.netfilter.nf_conntrack_max = 524288

# QEMU/KVM: I/O assíncrono por VM. O default (65536 global) esgota-se depressa.
fs.aio-max-nr = 1048576

# Sintoma: bridges de VM a perder tráfego entre si porque o nftables não as vê.
net.bridge.bridge-nf-call-iptables = 1
net.bridge.bridge-nf-call-ip6tables = 1

# perf/bpftrace úteis sem ser root, sem abrir o kernel de par em par:
# 1 permite perf ao nível de utilizador; -1 (tudo) fica para quem escolher.
kernel.perf_event_paranoid = 1
kernel.kptr_restrict = 1

# NOTA deliberada: NÃO baixamos net.ipv4.ip_unprivileged_port_start.
# Publicar :80/:443 sem root é conveniente, mas abre a porta a que qualquer
# processo do utilizador se faça passar por um serviço de sistema. Quem precisar
# (ingress local, por exemplo) que corra:
#     sudo sysctl -w net.ipv4.ip_unprivileged_port_start=80
# ou use `delonix-toolbox unprivileged-ports on`.
