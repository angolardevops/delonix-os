#
# DelonixOS — perfil `tuned` para PORTÁTEIS de engenharia.
#
# Aplicado automaticamente pelo `delonix-tune` quando a máquina tem bateria.
# Para forçar:  sudo tuned-adm profile delonix-lab-mobile
#
# PORQUÊ UM PERFIL SEPARADO
#
# Um Ryzen 9 HX ou um Core i9 de portátil têm o mesmo número de núcleos que um
# processador de secretária e uma fracção da dissipação. O perfil `delonix-lab`
# mantém frequências altas e estados de repouso desligados — o que num chassis
# com 15 mm de espessura significa arrancar cada compilação já no limite
# térmico, com as ventoinhas no máximo e o processador a limitar-se.
#
# Este perfil parte de outro princípio: manter o processador FRIO em repouso
# para ter margem quando o trabalho chega. Sob carga sustentada é o mais rápido
# dos dois, porque não gasta o orçamento térmico antes de começar.
#
[main]
summary=DelonixOS — portátil de engenharia (desempenho sustentado, sem sobreaquecer)
include=balanced

[cpu]
# `powersave` com `amd_pstate=active` / `intel_pstate=active` NÃO é o governor
# lento. Nestes drivers a decisão de frequência passa para o próprio
# processador (HWP/CPPC), que sobe ao máximo em microssegundos quando há
# trabalho. O governor `performance` não o torna mais rápido — só o impede de
# descer quando não há nada a fazer, que é exactamente o que aquece à toa.
governor=powersave
energy_perf_bias=balance_performance|balance_power
energy_performance_preference=balance_performance|balance_power

# Estados de repouso profundos MANTIDOS. Cada núcleo adormecido é orçamento
# térmico que os núcleos activos podem usar para subir mais — é assim que o
# turbo funciona. Desligá-los num portátil troca latência de microssegundos
# por centenas de MHz sob carga.
# (Sem `force_latency` — herdado do perfil `balanced`.)

# Sem limite inferior artificial: em repouso deve mesmo descer.
min_perf_pct=1

[vm]
# THP em `madvise`: quem quer páginas grandes pede-as (o QEMU pede). Em
# `always` o compactador do kernel mete-se no caminho de builds e de bases de
# dados — e compactar memória é trabalho de CPU, ou seja, calor.
transparent_hugepages=madvise

[sysctl]
# Os mesmos ajustes de carga do perfil de secretária: o trabalho é o mesmo,
# só a dissipação é que não é.
kernel.sched_migration_cost_ns=5000000
kernel.sched_autogroup_enabled=0
vm.dirty_expire_centisecs=1000
vm.dirty_writeback_centisecs=500

[disk]
readahead=>4096

[scheduler]
cgroup_ps_blacklist=/system.slice/

[bootloader]
# Nada imposto daqui: quem manda no cmdline é o /etc/default/grub.
