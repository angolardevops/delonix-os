#
# DelonixOS — perfil `tuned` para labs críticos, em máquinas FIXAS.
#
# Escolhido automaticamente pelo `delonix-tune` quando a máquina NÃO tem
# bateria. Num portátil aplica-se o `delonix-lab-mobile`, que mantém os estados
# de repouso ligados — ver o cabeçalho desse ficheiro para o porquê.
#
#   tuned-adm active                        ver o que está activo
#   delonix-tune apply                      voltar a escolher pelo hardware
#   sudo tuned-adm profile delonix-lab      forçar este
#
# A escolha aqui é deliberada: latência e throughput acima de poupança, porque
# uma workstation com dissipação a sério passa o dia a correr VMs, clusters
# locais e compilações, e a energia não é o recurso escasso.
#
[main]
summary=DelonixOS — labs de virtualização e containers em máquina fixa (latência e I/O acima de poupança)
include=throughput-performance

[cpu]
# Sem estados C profundos: acordar uma vCPU custa menos do que a latência de
# a acordar. Isto só é aceitável com dissipação de secretária — num chassis de
# portátil é o caminho directo para o limite térmico.
force_latency=cstate.id_no_zero:1|3
governor=performance|powersave
energy_perf_bias=performance|normal
energy_performance_preference=performance|balance_power
min_perf_pct=20

[vm]
# THP em `madvise`: quem quer páginas grandes pede-as (QEMU pede). Em `always`
# o compactador do kernel mete-se no caminho de builds e de bases de dados.
transparent_hugepages=madvise

[sysctl]
# Ver /etc/sysctl.d/99-delonix.conf — aqui só o que é específico de carga.
kernel.sched_migration_cost_ns=5000000
kernel.sched_autogroup_enabled=0
vm.dirty_expire_centisecs=1000
vm.dirty_writeback_centisecs=500

[disk]
readahead=>4096

[scheduler]
# Containers e VMs criam e destroem processos aos milhares; não vale a pena
# migrar cgroups entre CPUs por causa disso.
cgroup_ps_blacklist=/system.slice/

[bootloader]
# Nada de parâmetros de arranque impostos pelo tuned: quem manda no cmdline é
# o /etc/default/grub, para não haver duas fontes de verdade.
