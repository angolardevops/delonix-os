#
# DelonixOS — perfil `tuned` para labs críticos de DevOps/SRE/Platform.
#
# Activa-se sozinho no primeiro arranque (delonix-firstboot). Para ver ou
# trocar:  tuned-adm active   /   sudo tuned-adm profile delonix-lab
#
# A escolha é deliberada: latência e throughput acima de poupança de energia,
# porque este posto passa o dia a correr VMs, clusters locais e builds. Num
# portátil a bateria, o TLP continua a mandar no que é dele.
#
[main]
summary=DelonixOS — labs de virtualização e containers (latência e I/O acima de poupança)
include=throughput-performance

[cpu]
# Sem estados C profundos: acordar uma vCPU custa menos.
force_latency=cstate.id_no_zero:1|3
governor=performance|powersave
energy_perf_bias=performance|normal
min_perf_pct=20

[vm]
# THP em `madvise`: quem quer páginas grandes pede-as (QEMU pede). Em `always`
# o compactador do kernel mete-se no caminho de builds e de bases de dados.
transparent_hugepages=madvise

[sysctl]
# Ver /etc/sysctl.d/99-delonix.conf — aqui só o que é específico de carga.
kernel.sched_migration_cost_ns=5000000
kernel.sched_autogroup_enabled=0
vm.dirty_expire_centisecs=1000
vm.dirty_writeback_centisecs=500

[disk]
readahead=>4096

[scheduler]
# Containers e VMs criam e destroem processos aos milhares; não vale a pena
# migrar cgroups entre CPUs por causa disso.
cgroup_ps_blacklist=/system.slice/

[bootloader]
# Nada de parâmetros de arranque impostos pelo tuned: quem manda no cmdline é
# o /etc/default/grub, para não haver duas fontes de verdade.
