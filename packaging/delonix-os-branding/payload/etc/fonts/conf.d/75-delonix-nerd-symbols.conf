<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  DelonixOS — glifos Nerd Font sem carregar a fonte inteira repatchada.

  PORQUÊ

  O `ttf-jetbrains-mono-nerd` são 233 MB porque traz a JetBrains Mono inteira
  reprocessada, em três variantes e todos os pesos, só para lhe acrescentar uns
  milhares de ícones. A forma recomendada hoje é outra: a fonte normal (8 MB) e
  um ficheiro só com os símbolos (2,5 MB), com o fontconfig a ir buscar ao
  segundo os glifos que o primeiro não tem.

  O ttf-nerd-fonts-symbols-mono NÃO traz nenhuma regra de fontconfig — a ordem
  actual funciona por acaso, e "por acaso" é o que se parte numa actualização.
  Este ficheiro torna-a explícita: qualquer pedido de fonte monoespaçada passa a
  ter os símbolos Nerd como recurso declarado.

  É disto que dependem os ícones do starship, do k9s, do lazygit e do eza. Se um
  dia aparecerem quadrados vazios no prompt, é aqui que se olha primeiro:
    fc-match -s monospace | head -3
-->
<fontconfig>

  <!-- Recurso para qualquer pedido genérico de monoespaçada. -->
  <match target="pattern">
    <test name="family"><string>monospace</string></test>
    <edit name="family" mode="append" binding="weak">
      <string>Symbols Nerd Font Mono</string>
    </edit>
  </match>

  <!-- E para a nossa fonte por nome, que é como o kitty e o KDE a pedem. -->
  <match target="pattern">
    <test name="family"><string>JetBrains Mono</string></test>
    <edit name="family" mode="append" binding="weak">
      <string>Symbols Nerd Font Mono</string>
    </edit>
  </match>

  <!-- O nome antigo, da fonte repatchada, continua a resolver para a nova.
       Quem trouxe um .config de outra máquina não fica com quadrados. -->
  <match target="pattern">
    <test name="family"><string>JetBrainsMono Nerd Font</string></test>
    <edit name="family" mode="assign" binding="same">
      <string>JetBrains Mono</string>
    </edit>
  </match>

</fontconfig>
