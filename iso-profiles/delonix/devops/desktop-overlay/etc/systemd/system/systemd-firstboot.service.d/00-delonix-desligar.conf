[Unit]
# O `systemd-firstboot` PÁRA o arranque num ecrã azul a pedir o fuso horário.
#
# Três tentativas antes desta, e porque falharam:
#   · `disable_systemd_live` — a unidade corre por `ConditionFirstBoot=yes`, que
#     é verdadeira sempre que o /etc/machine-id está vazio. Desactivar não muda
#     a condição.
#   · fornecer /etc/locale.conf e /etc/hostname — reduz o que ele pergunta, mas
#     ele continua a correr e a esperar pelo fuso.
#   · `systemd.firstboot=off` no cmdline — correcto, mas só se aplica às
#     entradas de arranque que NÓS geramos.
#
# Uma condição que nunca é satisfeita desliga-a de vez, em qualquer caminho de
# arranque. O fuso horário é trabalho do INSTALADOR, que o adivinha pela rede.
ConditionPathExists=/etc/delonix-nunca-existe
