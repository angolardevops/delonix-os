# DelonixOS — splash de arranque.
[Daemon]
Theme=delonix
ShowDelay=0

# `DeviceScale=1` impede o Plymouth de escalar a partir de uma framebuffer
# pequena. Combinado com o `GRUB_GFXPAYLOAD_LINUX=keep` (que mantém a resolução
# do GRUB até ao kernel), o splash é desenhado na resolução nativa em vez de
# ampliado — que era o que fazia o texto parecer desfocado.
DeviceScale=1
