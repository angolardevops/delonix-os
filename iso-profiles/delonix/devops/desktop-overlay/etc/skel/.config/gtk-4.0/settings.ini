# DelonixOS — o mesmo para GTK4 (libadwaita respeita o prefer-dark).
#
# Sem isto, o Chrome, o Edge, o Firefox e qualquer utilitário GTK abrem em tema
# claro sobre um desktop escuro — que é exactamente a incoerência que se nota
# mais. O `prefer-dark` também é o que faz as páginas web com
# `prefers-color-scheme` abrirem no modo certo.
[Settings]
gtk-theme-name=Breeze-Dark
gtk-icon-theme-name=breeze-dark
gtk-font-name=Noto Sans 10
gtk-cursor-theme-name=breeze_cursors
gtk-cursor-theme-size=24
gtk-application-prefer-dark-theme=true
gtk-enable-animations=false
gtk-primary-button-warps-slider=false
gtk-xft-antialias=1
gtk-xft-hinting=1
gtk-xft-hintstyle=hintslight
gtk-xft-rgba=rgb
