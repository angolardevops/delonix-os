# DelonixOS — registos OCI para containers rootless.
#
# Explícito de propósito: sem `unqualified-search-registries` alargado, um
# `podman run alpine` sem prefixo não vai buscar imagens a um registo que
# ninguém escolheu. Quem quiser outro registo (o da empresa, por exemplo)
# acrescenta-o aqui.
unqualified-search-registries = ["docker.io"]

[[registry]]
prefix = "docker.io"
location = "registry-1.docker.io"

