; DelonixOS — perfil de gravação para vídeo-aulas.
;
; Escolhas e porquês:
;   1080p60, sem redimensionar  — o texto de um terminal fica ilegível quando a
;                                 saída é reescalada; melhor gravar 1:1.
;   x264 veryfast, CQP 20       — funciona em QUALQUER máquina, sem depender do
;                                 encoder do fabricante. Para gravar sem custo
;                                 de CPU, troca para VAAPI/NVENC em Definições →
;                                 Saída → Gravação (uma caixa de selecção), ou
;                                 usa o `gpu-screen-recorder`, que já o faz.
;   mkv                         — se a gravação for interrompida (bateria, kernel
;                                 panic), um mkv abre na mesma; um mp4 perde-se.
;                                 O Kdenlive lê mkv sem converter.
;   48 kHz                      — o que o PipeWire usa; evita reamostragem.

[General]
Name=DelonixOS

[Video]
BaseCX=1920
BaseCY=1080
OutputCX=1920
OutputCY=1080
FPSType=0
FPSCommon=60
ScaleType=bicubic
ColorFormat=NV12
ColorSpace=709
ColorRange=Partial

[Audio]
SampleRate=48000
ChannelSetup=Stereo

[Output]
Mode=Advanced

[AdvOut]
RecType=Standard
# `delonix` estava em código-fixo aqui: numa máquina instalada, o utilizador
# tem outro nome e o OBS gravava para uma pasta que não existe. O `~` é
# expandido pelo OBS.
RecFilePath=~/Videos/DelonixOS
RecFormat2=mkv
RecEncoder=obs_x264
RecRescale=false
RecTracks=1
FFOutputToFile=true

[SimpleOutput]
RecQuality=HQ
RecFormat2=mkv
RecEncoder=x264
VBitrate=12000
ABitrate=192

[Hotkeys]
OBSBasic.StartRecording={"bindings":[{"control":true,"key":"OBS_KEY_F9"}]}
OBSBasic.StopRecording={"bindings":[{"control":true,"key":"OBS_KEY_F10"}]}
OBSBasic.PauseRecording={"bindings":[{"control":true,"key":"OBS_KEY_F11"}]}
