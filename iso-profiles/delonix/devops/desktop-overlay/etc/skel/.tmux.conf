# DelonixOS — tmux
# Configuração pensada para sessões longas de operação (bastion, war room).

set -g prefix C-a
unbind C-b
bind C-a send-prefix

set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 100000
set -sg escape-time 10
set -g focus-events on
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-kitty:Tc,*256col*:Tc"

# divisões que herdam o directório
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
bind r source-file ~/.tmux.conf \; display "tmux recarregado"

# navegação estilo vim
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# --- estilo Delonix ----------------------------------------------------------
set -g status-position bottom
set -g status-style "bg=#16191e,fg=#8b9099"
# Vermelho profundo em vez do vermelho da marca: o bloco do nome da sessão
# está sempre no ecrã, e a 100% de saturação puxa o olho o tempo todo.
set -g status-left  "#[bg=#7a2530,fg=#f0ecec,bold] #S #[bg=#16191e,fg=#8b9099] "
set -g status-left-length 30
set -g status-right "#[fg=#8b9099]#(kubectl config current-context 2>/dev/null) #[fg=#4a5058]│ #[fg=#e6e8ec]#H #[bg=#262a31,fg=#e6e8ec] %Y-%m-%d %H:%M "
set -g status-right-length 90
setw -g window-status-current-style "fg=#d6848a,bold"
setw -g window-status-style "fg=#8b9099"
set -g pane-border-style "fg=#262a31"
set -g pane-active-border-style "fg=#b03a44"
set -g message-style "bg=#7a2530,fg=#f0ecec"
