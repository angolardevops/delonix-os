##############################################################################
# DelonixOS — DevOps / SRE / Platform Engineering Edition
# Perfil manjaro-tools (buildiso). Base: Manjaro KDE Plasma.
#
# Só entram aqui chaves que o manjaro-tools lê de facto (ver `load_profile()`
# em lib/util.sh). Chaves inventadas são silenciosamente ignoradas — e depois
# passa-se uma tarde a perceber porque é que o splash não mudou.
#
# Filosofia: um posto de trabalho de engenharia de plataforma, não um desktop
# de escritório. Nada de office, PIM, jogos, indexação de ficheiros ou stack de
# impressão por omissão. O que fica é: terminal, containers rootless, k8s, IaC,
# rede e observabilidade.
##############################################################################

# --- sessão -------------------------------------------------------------------
displaymanager="sddm"      # é acrescentado automaticamente a enable_systemd
autologin="true"

# O shell por omissão é o zsh — com a configuração em /etc/skel/.zshrc.
user_shell="/usr/bin/zsh"  # utilizador criado pelo Calamares
login_shell="/usr/bin/zsh" # utilizador da sessão live

# --- base ----------------------------------------------------------------------
multilib="true"
nonfree_mhwd="true"        # activa as entradas >nonfree_x86_64 do Packages-Mhwd
extra="false"              # perfil enxuto: as entradas >extra ficam de fora

# --- arranque / EFI ------------------------------------------------------------
efi_boot_loader="grub"

# `splash` é o que faz o Plymouth aparecer no live. O tema em si vem do
# desktop-overlay (/etc/plymouth/plymouthd.conf → Theme=delonix); o
# manjaro-tools não tem chave de tema.
# `amd_pstate`/`intel_pstate`: os dois de propósito — a mesma ISO arranca em
# Ryzen e em Intel vPro, e cada kernel ignora o do outro fabricante. Sem isto o
# live cai no `acpi-cpufreq` e sobe de frequência devagar.
# `systemd.firstboot=off` — é ISTO que desliga o ecrã azul "Initial Setup" que
# pára o arranque a pedir o fuso horário. Tentei primeiro pelo disable_systemd_live
# e não chegou: o systemd-firstboot corre por `ConditionFirstBoot=yes`, que é
# verdadeira sempre que o /etc/machine-id está vazio — e num live está sempre.
# Desactivar a unidade não muda a condição; o parâmetro de arranque muda.
custom_boot_args=('splash' 'systemd.unified_cgroup_hierarchy=1'
                  'systemd.firstboot=off'
                  'nowatchdog' 'amd_pstate=active' 'intel_pstate=active')

# --- identidade do live ---------------------------------------------------------
hostname="delonix"
username="delonix"
password="delonix"
# `kvm` e `libvirt`: sem estes grupos não há VMs sem sudo.
addgroups="video,audio,power,network,lp,scanner,wheel,users,storage,rfkill,input,kvm,libvirt"

# --- instalador ------------------------------------------------------------------
netinstall="false"
chrootcfg="false"
geoip="true"
office_installer="false"
smb_workgroup=""

# --- serviços do sistema instalado -----------------------------------------------
enable_systemd=('avahi-daemon'
                'bluetooth'
                'cronie'
                'ModemManager'
                'NetworkManager'
                'systemd-timesyncd'
                'earlyoom'
                'nftables'
                'apparmor'
                'irqbalance'
                'ananicy-cpp'          # prioridade automática ao processo em foco
                'systemd-oomd'         # decide por PRESSÃO (PSI), não por RAM livre
                'tuned'
                'tuned-ppd'            # seletor de energia do KDE, servido pelo tuned
                'libvirtd.socket'      # activação por socket: só arranca quando é usado
                'virtlogd.socket'
                'delonix-firstboot'    # unidade nossa (desktop-overlay)
                'delonix-energia')     # ventoinha e ASPM conforme a alimentação

enable_systemd_timers=('fstrim')

# --- serviços desligados (peso/ruído que não queremos num posto de eng.) ---------
# Nota: o cups nem sequer é instalado; fica listado para o caso de entrar por
# dependência de alguma coisa.
# O CLI do docker vem instalado, o DAEMON não corre: o DOCKER_HOST aponta ao
# podman rootless. Ligar o dockerd é uma decisão consciente de quem administra.
# As bases de dados vêm INSTALADAS mas paradas: três servidores a dormir custam
# ~600 MB de RAM que ninguém pediu. `delonix-toolbox db start postgres` liga-as.
#
# ARRANQUE: o `NetworkManager-wait-online` é o maior travão do arranque de
# qualquer distro moderna — bloqueia o `network-online.target` até haver IP,
# entre 5 e 30 segundos, e num portátil com Wi-Fi é sempre o pior caso. Nada no
# DelonixOS precisa de rede ANTES do ambiente gráfico: o NetworkManager continua
# a ligar normalmente, só deixa de fazer o resto do sistema esperar por ele.
disable_systemd=('NetworkManager-wait-online'
                 'systemd-networkd-wait-online'
                 'pacman-init'
                 'postgresql'
                 'valkey'
                 'mongodb'
                 'docker'
                 'docker.socket'
                 'cups'
                 'org.cups.cupsd'
                 'smb'
                 'nmb'
                 'sshd')

# --- apenas no ambiente live -------------------------------------------------------
enable_systemd_live=('manjaro-live' 'mhwd-live' 'pacman-init' 'mirrors-live'
                     'delonix-live-home')   # home gravável antes do SDDM
# O `systemd-firstboot` PÁRA o arranque do live num ecrã azul a pedir o fuso
# horário, o locale e o nome da máquina — e fica à espera de um Enter que
# ninguém sabe que tem de dar. Ele só corre porque não encontra /etc/localtime
# nem /etc/locale.conf; nós fornecemos os dois no live-overlay e desactivamo-lo
# na mesma, por cinto e suspensórios.
#
# O fuso certo é problema do INSTALADOR, que o pergunta com um mapa — e o
# Calamares tem `geoip` para o adivinhar pela rede. Não é trabalho de um prompt
# de texto antes de haver ambiente gráfico.
disable_systemd_live=('delonix-firstboot'
                      'systemd-firstboot')
