---
# O fuso horário vem da REDE, não de uma pergunta. O Calamares consulta o
# serviço de geolocalização e pré-selecciona o fuso e a região no mapa — a
# pessoa confirma em vez de procurar.
#
# `geoipStyle: json` com o endpoint da Ubiquity é o que a maioria das distros
# usa; se não houver rede, cai no valor por omissão abaixo sem bloquear nada.
region: "Africa"
zone: "Luanda"

geoipStyle: "json"
geoipUrl: "https://geoip.kde.org/v1/calamares"

# pt_AO não existe no glibc — é gerado pelo delonix-os-settings depois de
# instalar. Aqui fica o pt_PT, que existe, e a cadeia LANGUAGE resolve o resto.
localeGenPath: "/etc/locale.gen"
