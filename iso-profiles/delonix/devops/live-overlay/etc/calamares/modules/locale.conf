# DelonixOS — Angola por omissão.
#
# O `pt_AO` não existe no glibc: é gerado a partir da definição que o
# delonix-os-settings instala (ver /usr/lib/delonix/gerar-locale). Se por
# alguma razão não for gerado, o sistema fica em pt_PT — nunca num locale que
# não existe.
region: "Africa"
zone:   "Luanda"
geoipStyle: "json"
