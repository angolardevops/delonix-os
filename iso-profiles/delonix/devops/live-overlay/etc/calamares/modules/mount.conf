# DelonixOS — opções de montagem.
#
# `compress=zstd:1` não é para poupar disco: é para LER menos. Num NVMe moderno
# descomprimir custa menos do que ler os bytes a mais, por isso o sistema fica
# mais rápido e ocupa menos. O nível 1 é o ponto em que isso ainda é verdade.
#
# `noatime` evita uma escrita por cada leitura — num posto que compila, são
# milhares por minuto.
extraMounts:
    - device: proc
      fs: proc
      mountPoint: /proc
    - device: sys
      fs: sysfs
      mountPoint: /sys
    - device: /dev
      mountPoint: /dev
      options: [ bind ]
    - device: tmpfs
      fs: tmpfs
      mountPoint: /run
    - device: /run/udev
      mountPoint: /run/udev
      options: [ bind ]

mountOptions:
    - filesystem: default
      options: [ defaults, noatime ]
    - filesystem: btrfs
      options: [ defaults, noatime, compress=zstd:1, space_cache=v2, discard=async ]
    - filesystem: ext4
      options: [ defaults, noatime, commit=60 ]
    - filesystem: xfs
      options: [ defaults, noatime, logbsize=256k ]
    - filesystem: efi
      options: [ defaults, noatime, umask=0077 ]

btrfsSwapSubvol: /@swap
