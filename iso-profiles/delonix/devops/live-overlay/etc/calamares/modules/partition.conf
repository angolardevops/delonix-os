# DelonixOS — instalador: sistema de ficheiros e layout recomendados.
#
# A escolha, e o porquê de cada uma, está em docs/pt-AO/sistemas-de-ficheiros.md.
# Em resumo, para um posto de DevOps/SRE/Platform Engineering:
#
#   Btrfs   ← por omissão. Instantâneos antes de cada `pacman -Syu` (snap-pac),
#             compressão zstd que poupa disco E leituras, subvolumes em vez de
#             partições fixas — num posto que corre VMs e clusters locais, o
#             espaço nunca está onde se previu.
#   ext4    ← a escolha segura. Sem instantâneos, sem compressão, mas é a que
#             qualquer live-CD do mundo consegue reparar.
#   XFS     ← melhor para ficheiros grandes e escrita paralela (imagens de VM).
#             Recomendado para /var/lib/libvirt num disco separado, não para /.
#   ZFS     ← só com um pool dedicado e RAM a sobrar. Não vem por omissão:
#             o módulo é externo ao kernel e uma actualização pode deixar o
#             sistema sem arrancar — risco que não se impõe a ninguém.

efiSystemPartition:     "/boot/efi"
efiSystemPartitionSize:  1024M
efiSystemPartitionName:  DELONIX_EFI

userSwapChoices:
    - none
    - small
    - suspend

# `small` fica pequena de propósito: o zram trata da troca de páginas em RAM
# (ver /etc/systemd/zram-generator.conf) e o disco só serve para hibernar.
swapPartitionName: swap
ensureSuspendToDisk: true
neverCreateSwap: false

drawNestedPartitions:   true
alwaysShowPartitionLabels: true
allowManualPartitioning:   true

defaultFileSystemType:  "btrfs"
availableFileSystemTypes: ["btrfs","ext4","xfs"]

# Subvolumes: é isto que permite instantâneos úteis. O @home fora do @ para um
# rollback do sistema NÃO levar o trabalho atrás; o @log e o @cache fora dos
# instantâneos porque restaurar logs antigos é pior do que perdê-los; e o
# @libvirt separado para as imagens de VM não entrarem em cada instantâneo — um
# disco de 40 GB por VM tornaria os instantâneos inúteis.
btrfsSubvolumes:
    - mountPoint: /
      subvolume:  /@
    - mountPoint: /home
      subvolume:  /@home
    - mountPoint: /var/cache
      subvolume:  /@cache
    - mountPoint: /var/log
      subvolume:  /@log
    - mountPoint: /var/lib/libvirt
      subvolume:  /@libvirt
    - mountPoint: /var/lib/delonix
      subvolume:  /@delonix
    - mountPoint: /.snapshots
      subvolume:  /@snapshots

# Sem isto o instalador aceita instalar num disco onde o Windows arranca em
# modo legado — e o resultado é uma máquina que não arranca em nenhum dos dois.
requiredStorageGiB: 25
