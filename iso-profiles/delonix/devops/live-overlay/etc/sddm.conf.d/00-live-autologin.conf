# Sessão live: entra directamente, sem pedir nada.
#
# O `autologin="true"` do profile.conf faz o manjaro-tools escrever a
# configuração — mas o nosso pacote delonix-os-settings instala um
# 10-delonix.conf, e o SDDM lê o conf.d por ordem alfabética com o ÚLTIMO a
# ganhar. Este ficheiro tem prefixo 00 de propósito: define o autologin sem
# competir com o resto, e o 10-delonix.conf não mexe nesta secção.
#
# Numa ISO live pedir palavra-passe não protege nada — a palavra-passe está no
# profile.conf, à vista de toda a gente. Só atrapalha quem quer experimentar.
[Autologin]
User=delonix
Session=plasma
Relogin=false
